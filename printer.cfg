[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 0.5
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 1900
position_min: -1900
homing_positive_dir: false
homing_speed: 50
gear_ratio: 7:4, 1:300, 1:3 
full_steps_per_rotation: 400
step_pulse_duration: 0.000002

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.65
diag_pin: ^gpio4
driver_SGTHRS: 100
sense_resistor: 0.110

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 0.5
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 1900
position_min: -1900
homing_positive_dir: false
homing_speed: 50
gear_ratio: 7:4, 1:300, 1:3
full_steps_per_rotation: 400
step_pulse_duration: 0.000002

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.65
diag_pin: ^gpio3
driver_SGTHRS: 100
sense_resistor: 0.110

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 1
position_endstop: 0
endstop_pin: ^gpio25
position_max: 3300
position_min: -3300
homing_positive_dir: false
homing_speed: 12
gear_ratio: 1:200, 1:3
full_steps_per_rotation: 400
step_pulse_duration: 0.000002

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.650
sense_resistor: 0.110

[mcu]
serial: /dev/ttyS0
restart_method: command

[printer]
work_radius: 1900
work_center_x: 0
work_center_y: 0
kinematics: cartesian
max_velocity: 9000
max_accel: 500000
max_z_velocity: 9000
max_z_accel: 500000

[force_move]
enable_force_move: True
[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 0 
gcode: 

[gcode_macro M3]
gcode:
    {% set S = params.S|default(0.0)|float %}
    SET_PIN PIN=TOOL VALUE={S / 255.0}

[gcode_macro M4]
gcode:
    {% set S = params.S|default(0.0)|float %}
    SET_PIN PIN=TOOL VALUE={S / 255.0}

[gcode_macro M5]
gcode:
    SET_PIN PIN=TOOL VALUE=0

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 52.400
shaper_type_y = mzv
shaper_freq_y = 46.200

#*# <---------------------- SAVE_CONFIG ---------------------->
