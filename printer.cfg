# --- sample focus-surface mesh (OFM smooth-AF driven; no probe hardware) ---
[bed_mesh]
mesh_min: 0, 0
mesh_max: 10, 10
# fade auto-disabled: fade_end <= fade_start
# mesh_min/max: placeholder to satisfy loader validation only.
# Never hardcode stage coordinates here - real mesh bounds are
# installed per-run by SAMPLE_MESH, measured around the actual sample.

[sample_mesh]
jog_follow: true
max_z_range: 1000.0

[stepper_music]
axes: xyz
file: /home/admin/music/timeline1.wav
amplitude: 6

[hwsync_strobe camera]
sync_pin: ^gpio16
output_pin: gpio24
pulse_duration: 0.000520

